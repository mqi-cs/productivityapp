<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Macro Map: Annual view to weekly focus.">
    <title>Macro Map | Navigation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Gloria+Hallelujah&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* -----------------------------------------------------------
           MACRO SPECIFIC OVERRIDES
           ----------------------------------------------------------- */
        body {
            overflow: hidden;
            background: var(--bg-dark);
        }

        .macro-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            perspective: 1000px;
            overflow: hidden;
            /* Scroll handled via JS wheel event for zoom */
        }

        /* 
           ZOOM VIEWPORT 
        */
        .zoom-world {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: center center;
            /* Will be manipulated by JS for Zoom/Pan */
            transition: transform 0.1s linear;
        }

        /* 
           LAYER 1: ANNUAL CONSTELLATION (The Year Map)
           Grid: 52 columns (weeks) x 7 rows (days)
        */
        .layer-year-map {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1400px;
            height: 400px;
            /* Aspect ratio for 52x7 approx */
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 6px;
            padding: 20px;
            pointer-events: none;
            /* Let clicks pass unless active */
        }

        .day-blob {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            position: relative;
            transition: all 0.5s ease;
        }

        /* Blob Logic: Dominant colors */
        .day-blob::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--blob-color, rgba(255, 255, 255, 0.1));
            filter: blur(4px);
            opacity: 0.6;
            transition: all 0.3s;
        }

        .day-blob.active-glow {
            box-shadow: 0 0 10px var(--blob-color);
            transform: scale(1.5);
            z-index: 10;
        }

        /* 
           LAYER 2: WEEKLY CRYSTALLIZATION
           The specific week grid that appears when zoomed in
        */
        .layer-week-focus {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90vw;
            max-width: 1200px;
            height: 70vh;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0;
            pointer-events: none;
            display: flex;
            gap: 20px;
            /* Layout similar to previous week view */
        }

        .layer-week-focus.visible {
            pointer-events: all;
        }

        /* Week Grid Styles */
        .week-focus-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: rgba(15, 17, 21, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(20px);
            gap: 1px;
            /* Divider feel */
        }

        .focus-day-col {
            position: relative;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px;
        }

        .focus-day-col:last-child {
            border-right: none;
        }

        .focus-day-header {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .task-block {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            font-size: 0.75rem;
            border-left: 2px solid var(--bar-color, #fff);
            color: #ddd;
        }

        /* 
           LENS FILTER SIDEBAR 
           (Reusing/Adapting from style.css principles)
        */
        .macro-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            width: 280px;
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(15px);
            border-left: 1px solid var(--glass-border);
            transform: translateX(280px);
            /* Hidden by default */
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 100;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
        }

        .macro-sidebar.open {
            transform: translateX(0);
        }

        .sidebar-toggle {
            position: absolute;
            left: -50px;
            top: 50px;
            /* High up */
            width: 50px;
            height: 50px;
            background: rgba(10, 12, 16, 0.8);
            border: 1px solid var(--glass-border);
            border-right: none;
            border-radius: 12px 0 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .filter-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .filter-option:hover,
        .filter-option.active {
            color: #fff;
        }

        .radio-circle {
            width: 16px;
            height: 16px;
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            position: relative;
        }

        .filter-option.active .radio-circle::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgb(var(--accent-glow));
            border-radius: 50%;
        }

        /* 
           TREND CONSTELLATION CHART 
           Bottom anchored
        */
        .trend-constellation {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to top, rgba(10, 12, 16, 0.95), transparent);
            z-index: 90;
            pointer-events: none;
            /* Let interact with map if empty space */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
        }

        .constellation-wrapper {
            position: relative;
            width: 800px;
            height: 150px;
        }

        .chart-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .constellation-label {
            position: absolute;
            top: -30px;
            left: 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>

<body>

    <a href="index.html" class="nav-link"
        style="position:fixed; top:40px; left:40px; z-index:200; color:var(--text-secondary); text-decoration:none; font-family:'Outfit'; text-transform:uppercase; font-size:0.8rem; letter-spacing:0.1em;">
        &larr; Return to Base
    </a>

    <!-- LENS SIDEBAR -->
    <div class="macro-sidebar" id="lensSidebar">
        <div class="sidebar-toggle" id="sidebarToggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <h3 class="filter-section-title">Lens Filter</h3>

        <div class="filter-option active" data-filter="all">
            <span>All Frequencies</span>
            <div class="radio-circle"></div>
        </div>

        <div class="filter-option" data-filter="importance">
            <span>High Importance</span>
            <div class="radio-circle"></div>
        </div>

        <div class="filter-section-title" style="margin-top: 30px;">Projects</div>

        <div class="filter-option" data-filter="project-phoenix">
            <span>Project Phoenix</span>
            <div class="radio-circle"></div>
        </div>
        <div class="filter-option" data-filter="deep-work">
            <span>Deep Work</span>
            <div class="radio-circle"></div>
        </div>
        <div class="filter-option" data-filter="health">
            <span>Health & Ritual</span>
            <div class="radio-circle"></div>
        </div>
    </div>


    <!-- MAIN MACRO VIEW -->
    <div class="macro-container" id="macroContainer">

        <div class="zoom-world" id="zoomWorld">

            <!-- YEAR LAYER -->
            <div class="layer-year-map" id="yearLayer">
                <!-- JS Generated Blobs -->
            </div>

            <!-- WEEK LAYER (Crystallization) -->
            <div class="layer-week-focus" id="weekLayer">
                <div class="week-focus-grid" id="weekGrid">
                    <!-- Columns -->
                </div>
            </div>

        </div>

    </div>

    <!-- TREND CONSTELLATION -->
    <div class="trend-constellation">
        <div class="constellation-wrapper">
            <div class="constellation-label">Cumulative Resonance (Last 14 Days)</div>
            <svg class="chart-svg" id="trendChart">
                <!-- JS Generated Polyline -->
                <linearGradient id="glowGradient" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="rgba(168, 237, 234, 0.4)" />
                    <stop offset="100%" stop-color="rgba(168, 237, 234, 0)" />
                </linearGradient>
            </svg>
        </div>
    </div>

    <script>
        // CONFIG
        const CONFIG = {
            totalWeeks: 52,
            daysPerWeek: 7,
            colors: {
                phoenix: 'rgba(255, 100, 100, 1)',
                deep: 'rgba(100, 100, 255, 1)',
                health: 'rgba(100, 255, 150, 1)',
                neutral: 'rgba(255, 255, 255, 0.1)'
            }
        };

        // STATE
        let zoomLevel = 0; // 0.0 to 1.0
        let currentFilter = 'all';

        // DOM ELEMENTS
        const world = document.getElementById('zoomWorld');
        const yearLayer = document.getElementById('yearLayer');
        const weekLayer = document.getElementById('weekLayer');
        const trendChart = document.getElementById('trendChart');

        // MOCK DATA GENERATOR
        const yearData = [];

        function initData() {
            // Generate data for 52 weeks * 7 days
            for (let w = 0; w < CONFIG.totalWeeks; w++) {
                for (let d = 0; d < CONFIG.daysPerWeek; d++) {
                    const rnd = Math.random();
                    let type = 'neutral';
                    let val = Math.random() * 5; // hours

                    if (rnd > 0.7) type = 'phoenix';
                    else if (rnd > 0.5) type = 'deep';
                    else if (rnd > 0.3) type = 'health';

                    yearData.push({
                        week: w,
                        day: d,
                        type: type,
                        value: val,
                        isImportant: val > 3.5 // arbitrary logic
                    });
                }
            }
        }

        // RENDER: Year Map
        function renderYearMap() {
            yearLayer.innerHTML = '';
            yearData.forEach((data, index) => {
                const blob = document.createElement('div');
                blob.className = 'day-blob';

                // Color Logic
                let color = CONFIG.colors.neutral;
                if (data.type !== 'neutral') color = CONFIG.colors[data.type];

                blob.style.setProperty('--blob-color', color);
                blob.dataset.index = index;
                blob.dataset.type = data.type;

                // Random subtle movement for "Map" feel
                blob.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;

                yearLayer.appendChild(blob);
            });
        }

        // RENDER: Week Grid (Mockup for current week)
        function renderWeekGrid() {
            const grid = document.getElementById('weekGrid');
            grid.innerHTML = '';
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            days.forEach((dayName, i) => {
                const col = document.createElement('div');
                col.className = 'focus-day-col';
                col.innerHTML = `<div class="focus-day-header">${dayName}</div>`;

                // Add fake tasks
                const numTasks = Math.floor(Math.random() * 4);
                for (let j = 0; j < numTasks; j++) {
                    const task = document.createElement('div');
                    task.className = 'task-block';
                    task.innerText = ['Deep Work', 'Review', 'Meeting', 'Planning'][Math.floor(Math.random() * 4)];
                    task.style.setProperty('--bar-color', 'rgb(168, 237, 234)');
                    col.appendChild(task);
                }

                grid.appendChild(col);
            });
        }

        // RENDER: Trend Constellation (Dynamic)
        function renderTrendChart() {
            const dataSlice = yearData.slice(-14);
            const displayValues = dataSlice.map(d => {
                // Filter logic applied to chart values
                if (currentFilter === 'all') return d.value;
                if (currentFilter === 'importance') return d.isImportant ? d.value : 0;

                if (currentFilter === 'project-phoenix' && d.type === 'phoenix') return d.value;
                if (currentFilter === 'deep-work' && d.type === 'deep') return d.value;
                if (currentFilter === 'health' && d.type === 'health') return d.value;

                return 0;
            });

            const w = 800;
            const h = 150;
            const stepX = w / (displayValues.length - 1);

            // Build Points
            let points = "";
            displayValues.forEach((val, i) => {
                const x = i * stepX;
                const y = h - (val / 5 * h); // Scale to height
                points += `${x},${y} `;
            });

            // Create Path
            const path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            path.setAttribute("points", points);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "rgb(168, 237, 234)");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("filter", "drop-shadow(0 0 5px rgba(168,237,234,0.5))");
            path.style.transition = "d 0.5s ease";

            // Add Area
            const areaPoints = `0,${h} ` + points + `${w},${h}`;
            const area = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            area.setAttribute("points", areaPoints);
            area.setAttribute("fill", "url(#glowGradient)");

            trendChart.innerHTML = '';
            trendChart.appendChild(document.getElementById('glowGradient'));
            trendChart.appendChild(area);
            trendChart.appendChild(path);

            // Add dots
            displayValues.forEach((val, i) => {
                const x = i * stepX;
                const y = h - (val / 5 * h); // Scale to height
                const star = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                star.setAttribute("cx", x);
                star.setAttribute("cy", y);
                star.setAttribute("r", val > 0 ? 3 : 1);
                // If val is 0, make it barely visible to show grid line points, or hide
                star.setAttribute("fill", val > 0 ? "rgb(168, 237, 234)" : "rgba(255,255,255,0.1)");
                trendChart.appendChild(star);
            });
        }

        // INTERACTION: Smooth Zoom Scroll
        function handleScroll(e) {
            // e.deltaY > 0 -> Scroll Down -> Zoom IN
            // e.deltaY < 0 -> Scroll Up -> Zoom OUT

            const delta = e.deltaY * 0.001;
            zoomLevel += delta;

            // Clamp
            if (zoomLevel < 0) zoomLevel = 0;
            if (zoomLevel > 1) zoomLevel = 1;

            updateZoomVisuals();
        }

        function updateZoomVisuals() {
            // Year Layer: Scale 1 -> 5, Opacity 1 -> 0
            const yearScale = 1 + (zoomLevel * 6);
            const yearOpacity = 1 - (zoomLevel * 1.5);

            yearLayer.style.transform = `translate(-50%, -50%) scale(${yearScale})`;
            yearLayer.style.opacity = Math.max(0, yearOpacity);

            // Week Layer: Scale 0.2 -> 1, Opacity 0 -> 1
            // Starts appearing after 0.4
            let weekProgress = (zoomLevel - 0.4) * 1.66; // Normalize 0.4->1.0 to 0->1
            if (weekProgress < 0) weekProgress = 0;
            if (weekProgress > 1) weekProgress = 1;

            weekLayer.style.transform = `translate(-50%, -50%) scale(${0.2 + (weekProgress * 0.8)})`;
            weekLayer.style.opacity = weekProgress;

            if (weekProgress > 0.8) {
                weekLayer.classList.add('visible');
            } else {
                weekLayer.classList.remove('visible');
            }
        }

        // INTERACTION: Filters
        function initFilters() {
            const sidebar = document.getElementById('lensSidebar');
            const toggle = document.getElementById('sidebarToggle');
            const options = document.querySelectorAll('.filter-option');

            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            options.forEach(opt => {
                opt.addEventListener('click', () => {
                    // Update UI
                    options.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');

                    // Update Logic
                    currentFilter = opt.dataset.filter;
                    applyFilter();
                });
            });
        }

        function applyFilter() {
            const filter = currentFilter;
            const blobs = document.querySelectorAll('.day-blob');

            blobs.forEach((blob, i) => {
                const data = yearData[i];
                let visible = true;

                if (filter === 'importance') {
                    if (!data.isImportant) visible = false;
                } else if (filter === 'project-phoenix') {
                    if (data.type !== 'phoenix') visible = false;
                } else if (filter === 'deep-work') {
                    if (data.type !== 'deep') visible = false;
                } else if (filter === 'health') {
                    if (data.type !== 'health') visible = false;
                } else {
                    // All
                }

                if (visible) {
                    blob.style.opacity = 1;
                    blob.style.filter = 'blur(0px)';
                    blob.style.transform = `scale(1) translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                } else {
                    blob.style.opacity = 0.1;
                    blob.style.filter = 'blur(2px)';
                    blob.style.transform = 'scale(0.5)';
                }
            });

            // Re-render chart
            renderTrendChart();
        }

        // INIT
        initData();
        renderYearMap();
        renderWeekGrid();
        renderTrendChart();
        initFilters();

        document.addEventListener('wheel', handleScroll);

    </script>
</body>

</html>
